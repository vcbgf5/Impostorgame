<body>

<script src="js/mafiagame.js?v=202611011023"></script>
<script src="js/tv-mafia.js?v=202611011023"></script>
<script src="js/draw-core.js?v=202611011023"></script>
<script src="js/draw-pad.js?v=202611011023"></script>
<script src="js/draw-engine.js?v=202611011023"></script>
<script src="js/drawgame.js?v=202611011023"></script>
<script src="js/tv-draw.js?v=202611011023"></script>
<script>
// Połączenie z telefonem hosta: PeerJS (WebRTC) + BroadcastChannel (karta w tej samej przeglądarce)
(function () {
  var CFG = window.IMPOSTOR_CONFIG || {};
  var PREFIX = CFG.PEER_PREFIX || 'impostor-pl-gra-';
  var ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() { var c = ''; for (var i = 0; i < 4; i++) c += ABC[Math.floor(Math.random() * ABC.length)]; return c; }
  var code = newCode(); // zawsze nowy, losowy kod przy każdym uruchomieniu telewizora
  var fails = 0;

  // host (tryb jednego telefonu) wysyła 'state'/'hello'; gracze (tryb multi) wysyłają 'join', 'seen', 'vote'…
  function route(c, m) {
    if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
    if (!m) return;
    if (m.type === 'state' || m.type === 'hello') {
      if (m.type === 'hello') return;
      var ok = TV.onMessage(m);
      if (ok === false && !c._warned) {
        c._warned = true;
        try { c.send({ type: 'err', text: TV.mode === 'multi' ? 'Telewizor jest w trybie „Każdy swój telefon”. Zmień tryb na telewizorze.' : 'Telewizor jest ustawiony na inną grę. Zmień grę na telewizorze.' }); } catch (e) {}
        setTimeout(function () { try { c.close(); } catch (e) {} }, 800);
      }
      return;
    }
    if (m.type === 'dr' && !c._pid) { if (TV.game === 'draw' && TV.mode === 'single' && TV.drawOps) TV.drawOps(m); return; } // kreski od hosta (tryb jednego telefonu)
    if (m.type === 'join') players.add(c);
    (TV.game === 'mafia' ? MafiaGame : TV.game === 'draw' ? DrawGame : TVGame).onPlayerMsg(c, m);
  }
  // wszystkie telefony graczy – po zmianie gry/trybu proszone o ponowne dołączenie
  var players = new Set();
  TV.rejoinAll = function () { players.forEach(function (c) { if (c.open === false) { players.delete(c); return; } try { c.send({ type: 'rejoin' }); } catch (e) {} }); };
  // gracze w tej samej przeglądarce (test: play.html?local=1)
  try {
    var pbc = new BroadcastChannel('impostor-play'), fake = {};
    pbc.onmessage = function (e) {
      var d = e.data || {}; if (!d.from) return;
      var c = fake[d.from];
      if (!c) c = fake[d.from] = { open: true, send: function (m) { pbc.postMessage({ to: d.from, m: m }); }, close: function () { this.open = false; TVGame.onClose(this); MafiaGame.onClose(this); DrawGame.onClose(this); delete fake[d.from]; } };
      route(c, d.m);
    };
  } catch (e) {}

  try {
    var bc = new BroadcastChannel('impostor-tv');
    bc.onmessage = function (e) { var d = e.data || {}; if (d.type === 'dr') { if (TV.game === 'draw' && TV.mode === 'single' && TV.drawOps) TV.drawOps(d); return; } TV.onMessage(d); };
    TV.addSender(function (m) { bc.postMessage(m); });
  } catch (e) {}

  function start() {
    TV.setCode(code, 'connecting');
    if (!window.Peer) { TV.setCode(code, 'offline'); return setTimeout(start, 5000); }
    var peer = new Peer(PREFIX + code);
    peer.on('open', function () { fails = 0; TV.setCode(code, 'ready'); });
    peer.on('connection', function (c) {
      c.on('open', function () { TV.addSender(function (m) { if (c.open && !c._pid) c.send(m); }); });
      c.on('data', function (m) { route(c, m); });
      c.on('close', function () { players.delete(c); TVGame.onClose(c); MafiaGame.onClose(c); DrawGame.onClose(c); });
    });
    peer.on('disconnected', function () { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
    peer.on('error', function (e) {
      if (e.type === 'unavailable-id') {
        // kod zajęty (np. stara karta jeszcze wisi) – kilka prób, potem nowy kod
        try { peer.destroy(); } catch (x) {}
        code = newCode(); fails = 0;
        setTimeout(start, 3000);
      } else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed') {
        TV.setCode(code, 'offline');
        try { peer.destroy(); } catch (x) {}
        setTimeout(start, 4000);
      }
    });
  }
  start();
})();
</script>
</body>
