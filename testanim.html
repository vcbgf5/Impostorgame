<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test animacji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b1f;--panel:#1b1842;--line:#312c6e;--txt:#f4f2ff;--mut:#a29cd4;--pri:#ff3d71}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,sans-serif}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#141038;border-bottom:1px solid var(--line)}
  .bar b{font-weight:900;letter-spacing:.08em;color:var(--pri)}
  .bar a{color:#9fd0ff;font-size:13px;margin-left:auto}
  button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:14px}
  button:hover{border-color:#fff}
  button.pri{background:linear-gradient(135deg,#ff3d71,#7a2cff);border:0;font-weight:700}
  button.on{outline:2px solid #ffd43b}
  .main{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
  .tvwrap{position:relative;flex:1 1 640px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000}
  .tvwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .side{flex:0 0 300px;display:flex;flex-direction:column;gap:10px}
  .ph{position:relative;width:300px;height:617px;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#000}
  .ph iframe{position:absolute;left:0;top:0;width:360px;height:740px;border:0;transform:scale(.8333);transform-origin:0 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 12px 12px}
  .panel h3{margin:0 0 8px;font-size:14px;color:var(--mut);letter-spacing:.06em}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .cap{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="bar">
  <b>🎬 TEST ANIMACJI – MAFIA</b>
  <button class="pri" id="all">▶ Odtwórz wszystkie po kolei</button>
  <button id="stop">⏹ Stop</button>
  <span class="cap" id="now"></span>
  <a href="test.html">← pełny tryb testowy (TV + gracze)</a>
</div>
<div class="main">
  <div class="tvwrap"><iframe id="tv" title="Telewizor"></iframe></div>
  <div class="side"><div class="ph"><iframe id="ph" title="Telefon"></iframe></div><div class="cap">📱 Telefon gracza (Ania)</div></div>
</div>
<div class="panel">
  <h3>📺 TELEWIZOR</h3>
  <div class="btns" id="tvb">
    <button data-tv="kill">🔪 Zabójstwo</button><button data-tv="kill2">🔪🔪 Dwie ofiary + zemsta</button><button data-tv="poison">☠️ Trucizna</button>
    <button data-tv="save">🛡️ Obrona</button><button data-tv="dove">🕊️ Druga szansa</button><button data-tv="killsave">🔪+🛡️+🕊️ Wszystko naraz</button>
    <button data-tv="eject">🚪 Wyrzucenie (mafia)</button><button data-tv="eject2">🚪 Wyrzucenie (niewinny)</button><button data-tv="bomb">💣 Bomba</button>
    <button data-tv="night">🌙 Noc</button><button data-tv="day">☀️ Dzień</button><button data-tv="townwin">🏙️ Wygrywa miasto</button><button data-tv="mafiawin">🕴️ Wygrywa mafia</button>
  </div>
  <h3>📱 TELEFON</h3>
  <div class="btns" id="phb">
    <button data-ph="check-m">🕵️ Śledztwo: MAFIA</button><button data-ph="check-c">🔍 Śledztwo: CZYSTY</button><button data-ph="role">📁 Teczka</button>
    <button data-ph="shield">🛡️ Przeżyłeś atak</button><button data-ph="dove">🕊️ Druga szansa</button><button data-ph="alarm">🚨 Alarm</button>
    <button data-ph="hit-ok">🔪 Zlecenie wykonane</button><button data-ph="hit-no">🛡️ Ofiara przeżyła</button><button data-ph="dead">💀 Zginąłeś</button>
  </div>
  <p class="cap">Kliknij przycisk, żeby od razu zobaczyć animację. Dźwięk na TV włączy się po pierwszym kliknięciu w telewizor (zasada przeglądarek). Jeśli nic się nie dzieje, odśwież stronę: Ctrl+Shift+R.</p>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const v = Date.now().toString(36);
  $('tv').src = `tv.html?game=mafia&mode=multi&anim=${v}`;
  $('ph').src = `play.html?local=1&slot=anim&anim=${v}`;
  const TVD = { kill: 5, kill2: 8, poison: 5, save: 4.5, dove: 4.5, killsave: 9, eject: 6.5, eject2: 6.5, bomb: 8, night: 5, day: 5, townwin: 5, mafiawin: 5 };
  const PHD = { 'check-m': 3.5, 'check-c': 3.5, role: 3.5, shield: 3, dove: 3, alarm: 3, 'hit-ok': 3, 'hit-no': 3, dead: 4.5 };
  const PL = ['Ania', 'Bartek', 'Celina', 'Darek', 'Ewa', 'Franek'].map((n, i) => ({ id: 'd' + i, name: n, color: ['#ff4d6d', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8', '#ff922b'][i], emoji: ['🐱', '🦊', '🐸', '🦁', '🐷', '🐙'][i], score: 0, delta: 0, online: true, alive: true }));
  const mark = b => { document.querySelectorAll('button.on').forEach(x => x.classList.remove('on')); if (b) b.classList.add('on'); $('now').textContent = b ? 'Teraz: ' + b.textContent : ''; };
  function tvDemo(k) {
    const w = $('tv').contentWindow;
    if (!w || !w.TV) { alert('Telewizor jeszcze się ładuje – spróbuj za sekundę.'); return false; }
    if (!w.TV.demo) { alert('Przeglądarka ma w pamięci starą wersję gry. Odśwież stronę: Ctrl+Shift+R (albo Ctrl+F5).'); return false; }
    w.TV.demo(k); return true;
  }
  function phDemo(k) {
    const w = $('ph').contentWindow;
    if (!w || !w.__playerDemo) { alert('Telefon jeszcze się ładuje albo przeglądarka ma starą wersję (Ctrl+Shift+R).'); return false; }
    const dead = k === 'dead';
    const fx = { 'check-m': { k: 'check', t: 'd3', m: true, src: '🕵️ Śledztwo' }, 'check-c': { k: 'check', t: 'd2', m: false, src: '🔍 Lupa' }, role: { k: 'role', t: 'd4', r: 'doctor', src: '📁 Teczka' },
      shield: { k: 'shield' }, dove: { k: 'dove' }, alarm: { k: 'alarm', t: 'd5' }, 'hit-ok': { k: 'hit', t: 'd1', ok: true }, 'hit-no': { k: 'hit', t: 'd1', ok: false }, dead: { k: 'dead' } }[k];
    const me = Object.assign({}, PL[0], { alive: !dead });
    w.__playerDemo({ type: 'p', game: 'mafia', phase: 'morning', me, players: PL.map(p => p.id === 'd0' ? me : p), inRound: true, alive: !dead,
      role: k.startsWith('hit') ? 'mafia' : 'cop', mates: [], day: Date.now(), morning: { day: 2, victims: dead ? [{ id: 'd0', role: 'cop' }] : [] }, fx: [fx], priv: [], feed: [], dead: {} });
    return true;
  }
  document.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => { stopAll(); if (tvDemo(b.dataset.tv)) mark(b); });
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { stopAll(); if (phDemo(b.dataset.ph)) mark(b); });
  // wszystkie po kolei
  let timer = null;
  function stopAll() { clearTimeout(timer); timer = null; mark(null); }
  $('stop').onclick = stopAll;
  $('all').onclick = () => {
    stopAll();
    const seq = [...document.querySelectorAll('[data-tv],[data-ph]')];
    let i = 0;
    const next = () => {
      if (i >= seq.length) { mark(null); $('now').textContent = '✔ Koniec pokazu'; return; }
      const b = seq[i++], tv = !!b.dataset.tv;
      const ok = tv ? tvDemo(b.dataset.tv) : phDemo(b.dataset.ph);
      if (!ok) return;
      mark(b);
      timer = setTimeout(next, ((tv ? TVD[b.dataset.tv] : PHD[b.dataset.ph]) || 4) * 1000);
    };
    next();
  };
})();
</script>
</body>
</html>
